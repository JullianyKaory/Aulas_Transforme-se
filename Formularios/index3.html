<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários 3 (22/09)</title>
</head>
<body>
    <form action="" method="get">
        <fieldset>
            <legend>Opções</legend>
            <label for="">Estado:</label>
            <select name="estados" id="estado">
                <option value="">----Escolha---</option>
                <optgroup label=" Região Sul-Sudeste">
                    <option value="SP">São Paulo</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="RJ">Rio de Janeiro</option>
                </optgroup>

                <optgroup label="Região Centro-Oeste">
                    <option value="MT">Mato Grosso</option>
                </optgroup>

                <optgroup label="Região Norte-Nordeste">
                    <option value="BA">Bahia</option>
                    <option value="AM">Amazonas</option>
                    <option value="MA">Maranhão</option>
                </optgroup>
            </select>
            <br/>

            <label for="text">Mensagem:</label> <br/>
           <textarea name="texto" id="text" rows="5" cols="25"></textarea>

        </fieldset>
    </form>
</body>
</html>
