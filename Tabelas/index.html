<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>


    <style>
        table,
        td{
            border: 2px solid #3c0357;
            border-collapse: collapse;
        }
    </style>

</head>
<body>

<!-- TABLE
    TR - Table Row
        TH - Table Header
        TD -Table Data -->

    <table>
        <tr>
            <th>Produtos</th>
            <th>Preço</th>
        </tr>

        <tr>
            <td>Café</td>
            <td>R$ 50,00</td>
        </tr>

        <tr>
            <td>Arroz</td>
            <td>R$ 34,90</td>
        </tr>


    </table>
</body>
</html>
